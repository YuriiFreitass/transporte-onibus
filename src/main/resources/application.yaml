spring:
  application:
    name: transporte-api

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${ENV_DB_HOST:localhost}:3306/transporte?createDatabaseIfNotExist=true
    username: ${ENV_MYSQL_USER}
    password: ${ENV_MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 1