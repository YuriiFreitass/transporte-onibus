services:
  mysql:
    image: mysql:9.7.2

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${ENV_ROOT_PASSWORD}
      MYSQL_USER: ${ENV_MYSQL_USER}
      MYSQL_PASSWORD: ${ENV_MYSQL_PASSWORD}
      MYSQL_DATABASE: transporte

    volumes:
      - transporte-onibus-db:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${ENV_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  transporte-api:
    build: .

    ports:
      - "8080:8080"

    environment:
      ENV_MYSQL_USER: ${ENV_MYSQL_USER}
      ENV_MYSQL_PASSWORD: ${ENV_MYSQL_PASSWORD}
      ENV_DB_HOST: mysql

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  transporte-onibus-db: